name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (geometry engine)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SmartRoomScanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartRoomScanner-apk
          path: SmartRoomScanner.apk

      # Publishes the APK as a GitHub Release so it can be downloaded straight from a phone browser.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Smart Room Scanner build ${{ github.run_number }}
          files: SmartRoomScanner.apk
          make_latest: true
